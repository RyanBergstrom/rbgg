[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "0.1.0"
description = "API scaffold for rbgg project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.110.0",
    "PyYAML>=6.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.0",
]
rl = [
    "gymnasium>=1.0,<2.0",
    "stable-baselines3>=2.4,<3.0",
    "sb3-contrib>=2.4,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]